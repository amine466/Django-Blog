{% load static %}
{% load crispy_forms_tags %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static "admin/bootstrap-5.3.3-dist/css/bootstrap.min.css" %}">
    <link rel="stylesheet" href="{% static "admin/css/styles.css" %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="wrapper">
        <main class="content px-3 py-2">
            <div class="container card w-50 mt-5">
                <div class="card-body">
                    <h2 class="text-center">Login</h2>
                    <p class="text-center">Username: Admin - Password: #1Password</p>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button class="btn btn-primary w-100 mt-3" type="submit">Login</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
